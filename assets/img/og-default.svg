<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FF7A18"/>
      <stop offset="48%"  stop-color="#FF2E93"/>
      <stop offset="100%" stop-color="#12D6DF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%"   stop-color="#FF2E93" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#FF2E93" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#080B14"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(96,150)">
    <rect width="66" height="66" rx="20" fill="url(#g)"/>
    <circle cx="46" cy="20" r="9" fill="#080B14"/>
  </g>

  <text x="96" y="300" font-family="Plus Jakarta Sans, Segoe UI, sans-serif"
