  <text x="96" y="396" font-family="Plus Jakarta Sans, Segoe UI, sans-serif"
        font-size="92" font-weight="800" letter-spacing="-3" fill="url(#g)">Stand Out.</text>

  <text x="96" y="470" font-family="Plus Jakarta Sans, Segoe UI, sans-serif"
        font-size="30" font-weight="500" fill="#B9C4DD">Find something worth doing this week.</text>

  <text x="96" y="556" font-family="Plus Jakarta Sans, Segoe UI, sans-serif"
